  - front: "Die sechs häufigsten Fehler"
    back: |
      1. Nur zwei Leitpunkte bearbeitet - mindestens drei braucht es.
      2. Kein Betreff, keine Anrede oder kein Schluss.
      3. Register gemischt: "du" im formellen Brief oder "Sie" im
         freundschaftlichen.
      4. Zu wenige Wörter (unter 150) oder ein vorgeschriebener Text,
         der abgetippt wird.
      5. Auswendig gelernte Passagen, die nicht zur Aufgabe passen - die
         Bewertung erkennt das und es bringt keine Punkte.
      6. Verb an der falschen Position nach "deshalb", "trotzdem", "weil".
    note_type: schreiben
    tags: [checkliste]

  - front: "Checkliste: 5 Minuten vor der Abgabe"
    back: |
      [ ] Sind drei Leitpunkte ausführlich bearbeitet (je 2-3 Sätze)?
      [ ] Gibt es Betreff, Anrede, Einleitung, Schluss, Grußformel?
      [ ] Ist das Register durchgehend richtig (du oder Sie)?
      [ ] Steht das Verb nach "deshalb/trotzdem" an Position 2?
      [ ] Steht das Verb im Nebensatz am Ende?
      [ ] Sind alle Nomen groß geschrieben, alle Umlaute gesetzt?
      [ ] Mindestens 150 Wörter?
    note_type: schreiben
    tags: [checkliste]

  - front: "Wörter zählen - und was 150 Wörter bedeuten"
    back: |
      150 Wörter sind etwa 15 bis 18 Zeilen von Hand.
      Rechnen Sie mit rund 15 Wörtern pro Satz: das sind etwa 10 Sätze,
      also Einleitung (2) + drei Leitpunkte (je 2-3) + Schluss (1-2).
      Zählen Sie am Ende grob in Fünfergruppen - nicht Wort für Wort,
      dafür fehlt die Zeit.
    note_type: schreiben
    tags: [strategie]
